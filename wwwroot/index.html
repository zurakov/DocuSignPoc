<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>DocuSign POC — SQLite Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --bg: #0f172a; --surface: #1e293b; --surface2: #334155;
            --border: rgba(255,255,255,.06); --text: #e2e8f0; --muted: #94a3b8;
            --accent: #6366f1; --accent2: #8b5cf6; --green: #10b981;
            --orange: #f59e0b; --red: #ef4444;
        }
        * { margin:0; padding:0; box-sizing:border-box }
        body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:24px; }
        .container { max-width:1000px; margin:0 auto }
        .header { text-align:center; margin-bottom:32px; padding:32px 0; background:linear-gradient(135deg,rgba(99,102,241,.12),rgba(139,92,246,.08)); border-radius:20px; border:1px solid var(--border); }
        .header h1 span { background:linear-gradient(135deg,#6366f1,#a78bfa); -webkit-background-clip:text; -webkit-text-fill-color:transparent }
        .grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:24px }
        @media(max-width:700px) { .grid { grid-template-columns:1fr } }
        .card { background:var(--surface); border-radius:16px; padding:24px; border:1px solid var(--border); }
        .card h2 { font-size:16px; font-weight:600; margin-bottom:16px; display:flex; align-items:center; gap:8px }
        label { display:block; font-size:12px; font-weight:500; color:var(--muted); margin-bottom:4px; text-transform:uppercase; }
        input { width:100%; padding:10px 14px; border-radius:10px; border:1px solid var(--surface2); background:var(--bg); color:var(--text); font-size:14px; margin-bottom:12px; }
        .btn { width:100%; padding:12px; border:none; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; }
        .btn-primary { background:linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff; }
        .btn-secondary { background:linear-gradient(135deg,#10b981,#059669); color:#fff; }
        .table-card { grid-column:1/-1; overflow-x:auto; }
        table { width:100%; border-collapse:collapse; margin-top:16px; font-size:13px; }
        th { text-align:left; color:var(--muted); font-weight:500; padding:12px; border-bottom:1px solid var(--border); text-transform:uppercase; font-size:11px; }
        td { padding:12px; border-bottom:1px solid var(--border); }
        .badge { padding:3px 8px; border-radius:100px; font-size:11px; font-weight:600; }
        .badge-draft { background:rgba(148,163,184,.1); color:#94a3b8; }
        .badge-sent { background:rgba(99,102,241,.1); color:#818cf8; }
        .badge-completed { background:rgba(16,185,129,.1); color:#34d399; }
        .live-dot { width:8px; height:8px; border-radius:50%; background:#10b981; display:inline-block; animation:pulse 2s infinite; margin-right:6px }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><span>⚡ DocuSign Persistence POC</span></h1>
            <p>Single-Project Architecture — SQLite Database — Reliable Status Updates</p>
        </div>
        <div class="grid">
            <div class="card">
                <h2>Remote Email Signature</h2>
                <label>Invoice ID</label><input id="f1-invoice" value="INV-4401" />
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
                    <div><label>Company ID</label><input id="f1-company-id" value="C-1001" /></div>
                    <div><label>Company Name</label><input id="f1-company-name" value="Acme Corp" /></div>
                </div>
                <label>Email</label><input id="f1-email" value="zafarurakov@outlook.com" />
                <label>Name</label><input id="f1-name" value="Zafar Urakov" />
                <button class="btn btn-primary" onclick="req('send-email', 'f1')">📧 Send Email Request</button>
            </div>
            <div class="card">
                <h2>Onsite Embedded Signature</h2>
                <label>Invoice ID</label><input id="f2-invoice" value="INV-4402" />
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
                    <div><label>Company ID</label><input id="f2-company-id" value="C-1002" /></div>
                    <div><label>Company Name</label><input id="f2-company-name" value="Initech" /></div>
                </div>
                <label>Email</label><input id="f2-email" value="guest@example.com" />
                <label>Name</label><input id="f2-name" value="Guest Signer" />
                <button class="btn btn-secondary" onclick="req('embedded-signing-url', 'f2', true)">🖊️ Start In-Person Session</button>
            </div>
            <div class="card table-card">
                <h2><span class="live-dot"></span> Persistent Signature Requests (SQLite)</h2>
                <table id="requests-table">
                    <thead>
                        <tr>
                            <th>Invoice</th>
                            <th>Company</th>
                            <th>Recipient</th>
                            <th>Status</th>
                            <th>Type</th>
                            <th>Created</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="requests-body"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script>
        async function req(path, pref, redir=false) {
            const body = {
                invoiceId: document.getElementById(pref+'-invoice').value,
                companyId: document.getElementById(pref+'-company-id').value,
                companyName: document.getElementById(pref+'-company-name').value,
                email: document.getElementById(pref+'-email').value,
                name: document.getElementById(pref+'-name').value
            };
            try {
                const r = await fetch('/api/docusign/'+path, {
                    method:'POST', headers:{'Content-Type':'application/json'},
                    body:JSON.stringify(body)
                });
                const d = await r.json();
                if(r.ok) {
                    if(redir) location.href = d.signingUrl;
                    else { alert('Request Sent! ID: ' + d.envelopeId); updateTable(); }
                } else alert('Error: ' + JSON.stringify(d));
            } catch(e) { alert(e.message); }
        }

        async function updateTable() {
            try {
                const r = await fetch('/api/docusign/requests');
                const data = await r.json();
                document.getElementById('requests-body').innerHTML = data.sort((a,b) => new Date(b.createdDate) - new Date(a.createdDate)).map(row => `
                    <tr>
                        <td><b>#${row.invoiceId}</b></td>
                        <td>${row.companyName}<br><small style="color:var(--muted)">${row.accountId.substring(0,8)}...</small></td>
                        <td>${row.recipientName}<br><small style="color:var(--muted)">${row.recipientEmail}</small></td>
                        <td><span class="badge badge-${getStatusLabel(row.status).toLowerCase()}">${getStatusLabel(row.status)}</span></td>
                        <td>${row.type === 1 ? 'Email' : 'Embedded'}</td>
                        <td style="color:var(--muted)">${new Date(row.createdDate).toLocaleTimeString()}</td>
                        <td><button onclick="checkStatus('${row.envelopeId}')" style="cursor:pointer; background:none; border:1px solid var(--surface2); color:var(--accent); padding:4px 8px; border-radius:6px; font-size:10px;">Refresh</button></td>
                    </tr>
                `).join('');
            } catch(e) {}
        }

        function getStatusLabel(s) {
            return ["Draft", "Sent", "Delivered", "Completed", "Declined", "Voided"][s] || "Unknown";
        }

        async function checkStatus(id) {
            if(!id) return;
            await fetch('/api/docusign/check-status/'+id);
            updateTable();
        }

        setInterval(updateTable, 5000);
        updateTable();
    </script>
</body>
</html>
